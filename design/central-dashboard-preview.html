<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFU Monitor — 중앙 대시보드 시안</title><style>
:root{--bg:#f5f6f8;--panel:#fff;--sub:#eef1f5;--border:#dde2e8;--ink:#151a21;--muted:#556070;--blue:#1f6bc9;--green:#1d7f47;--warn:#8a5d00;--red:#c22b2b;color-scheme:light}html[data-theme=dark]{--bg:#0e1116;--panel:#151a21;--sub:#1b2430;--border:#303945;--ink:#e6eaf0;--muted:#a6b2c0;--blue:#80baff;--green:#4ade9a;--warn:#f5c451;--red:#ff8f8f;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,'Malgun Gothic',sans-serif}button{font:inherit;color:inherit;cursor:pointer}a{color:var(--blue)}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--border);padding:24px 16px;background:var(--panel)}.brand{font-weight:700;font-size:16px;margin-bottom:24px}.brand span{color:var(--blue)}.switch{display:flex;background:var(--sub);padding:3px;border-radius:6px;margin-bottom:22px}.switch button{flex:1;border:0;background:transparent;padding:6px}.switch button.active{background:var(--panel);border-radius:4px}.nav-title{font-size:12px;color:var(--muted);margin:22px 10px 7px}.nav button{display:block;text-align:left;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:6px}.nav button.active{background:var(--sub);font-weight:600}.nav .indent{padding-left:20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px}.dot.warn{background:var(--warn)}.dot.off{background:var(--muted)}main{padding:28px 32px;max-width:1600px;width:100%}.head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px}h1{font-size:24px;margin:0 0 5px}h2{font-size:15px;margin:0}p{margin:0}.muted{color:var(--muted)}.note{background:var(--sub);border:1px solid var(--border);padding:9px 12px;border-radius:6px;margin-bottom:20px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.stat{padding:0 20px;border-left:1px solid var(--border)}.stat:first-child{border:0;padding-left:0}.stat strong{display:block;font-size:25px;margin:4px 0}.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}.layout .panel{min-width:0}.flow{display:grid;grid-template-columns:1fr 40px 1.5fr;align-items:center;gap:12px}.node{border:1px solid var(--border);border-radius:8px;padding:14px}.node b{display:block;font-size:16px;margin:5px 0}.line{height:1px;background:var(--border)}.edges{display:grid;gap:8px}.edge{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:7px;padding:10px 12px;cursor:pointer;background:var(--panel);text-align:left;width:100%}.edge:hover,.nav button:hover{background:var(--sub)}.edge strong{font-size:14px}.status-ok{color:var(--green)}.status-warn{color:var(--warn)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted);font-weight:500}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border:0}.link{background:none;border:0;color:var(--blue);padding:0;text-align:left}.more{font-size:12px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.placeholder{padding:26px 0;color:var(--muted)}.back{background:none;border:0;color:var(--blue);padding:0;margin-bottom:8px}.mobile{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:14px}.brand{margin-bottom:10px}.nav{display:flex;overflow:auto;gap:4px}.nav-title,.nav .indent,.switch{display:none}.nav button{white-space:nowrap;width:auto}.mobile{display:inline}main{padding:20px 14px}.summary{grid-template-columns:repeat(2,1fr);gap:18px}.stat:nth-child(3){border:0;padding-left:0}.layout,.detail-grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.line{height:15px;width:1px;margin:auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span>✣</span> SFU Monitor</div><div class="switch"><button data-theme-choice="light" class="active">☀ 라이트</button><button data-theme-choice="dark">☾ 다크</button></div><nav class="nav" aria-label="대시보드"><button data-view="all" class="active">전체 현황</button><div class="nav-title">Origin</div><button data-view="origin">Origin</button><div class="nav-title">Edge 서버</div><button data-view="edges">전체 Edge 목록</button><button class="indent" data-view="edge-0"><i class="dot"></i>edge-0</button><button class="indent" data-view="edge-1"><i class="dot"></i>edge-1</button><button class="indent" data-view="edge-2"><i class="dot off"></i>edge-2</button><button data-view="alerts">전체 알림</button></nav></aside><main><div class="note">레이아웃 시안 · 아래 수치는 화면 예시이며 실제 서버 데이터가 아닙니다.</div><div id="content"></div></main></div><script>
const content=document.querySelector('#content');const servers=[{id:'edge-0',status:'정상',viewers:'45명',rate:'155 Mbps',room:'2개',signal:'방금 전',cls:'status-ok'},{id:'edge-1',status:'정상',viewers:'35명',rate:'120 Mbps',room:'1개',signal:'8초 전',cls:'status-ok'},{id:'edge-2',status:'응답 없음',viewers:'—',rate:'—',room:'—',signal:'2분 전',cls:'muted'}];const head=(title,sub)=>`<div class="head"><div><h1>${title}</h1><p class="muted">${sub}</p></div><span class="more">예시 데이터 · 10초 갱신</span></div>`;const rows=()=>servers.map(s=>`<tr><td><button class="link" data-open="${s.id}">${s.id}</button></td><td class="${s.cls}">${s.status}</td><td class="num">${s.room}</td><td class="num">${s.viewers}</td><td class="num">${s.rate}</td><td class="num">${s.signal}</td></tr>`).join('');const table=()=>`<div class="table-wrap"><table><thead><tr><th>서버</th><th>상태</th><th class="num">방송</th><th class="num">Viewers</th><th class="num">송신</th><th class="num">마지막 응답</th></tr></thead><tbody>${rows()}</tbody></table></div>`;
function render(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='all'){content.innerHTML=head('전체 현황','Origin과 각 Edge의 상태를 한 화면에서 확인합니다.')+`<section class="panel"><div class="summary"><div class="stat"><span class="muted">Origin</span><strong>1 / 1</strong><span class="status-ok">정상 응답</span></div><div class="stat"><span class="muted">Edge</span><strong>2 / 3</strong><span class="muted">1대 응답 없음</span></div><div class="stat"><span class="muted">방송</span><strong>2개</strong><span class="muted">Origin 기준</span></div><div class="stat"><span class="muted">Viewers</span><strong>80명</strong><span class="muted">응답한 Edge 기준 · 1대 제외</span></div></div></section><div class="layout"><section class="panel"><div class="panel-head"><h2>연결 흐름</h2><span class="more">Origin → Edge</span></div><div class="flow"><div class="node"><small class="muted">ORIGIN</small><b>origin</b><span class="status-ok">● 정상</span><p class="muted">송출 중인 방송 2개</p></div><div class="line"></div><div class="edges">${servers.map(s=>`<button class="edge" data-open="${s.id}"><span><strong>${s.id}</strong><br><small class="${s.cls}">● ${s.status}</small></span><span class="muted">${s.viewers} · ${s.rate} ›</span></button>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><h2>확인할 항목</h2><button class="link" data-open="alerts">전체 알림 →</button></div><p><span class="dot off"></span><strong>edge-2 응답 없음</strong></p><p class="muted" style="margin:8px 0 20px 15px">마지막 응답 2분 전</p><p class="muted">확인되지 않은 서버의 값은 전체 집계에서 제외됩니다.</p></section></div><section class="panel"><div class="panel-head"><h2>Edge 서버</h2><button class="link" data-open="edges">전체 보기 →</button></div>${table()}</section>`}else if(view==='edges'){content.innerHTML=head('전체 Edge 목록','서버를 선택해 해당 Edge의 상세 화면으로 이동합니다.')+`<section class="panel">${table()}</section>`}else if(view==='origin'){content.innerHTML=head('Origin','방송 입력과 Edge로 향하는 중계 상태')+`<section class="panel"><div class="summary"><div class="stat"><span class="muted">방송</span><strong>2개</strong></div><div class="stat"><span class="muted">연결된 Edge</span><strong>2 / 3</strong></div><div class="stat"><span class="muted">Workers</span><strong>1 / 1</strong></div><div class="stat"><span class="muted">상태</span><strong class="status-ok">정상</strong></div></div></section><section class="panel"><h2>Origin 메뉴</h2><p class="placeholder">Overview · Rooms & Broadcasters · Connected Edges · Alerts</p></section>`}else if(view==='alerts'){content.innerHTML=head('전체 알림','서버별 알림을 한곳에서 확인합니다.')+`<section class="panel"><p><span class="dot off"></span>edge-2 대시보드 응답 없음</p><p class="muted" style="margin:8px 0 0 15px">edge-2의 알림은 현재 불러올 수 없습니다.</p></section>`}else{const s=servers.find(x=>x.id===view)||servers[0];content.innerHTML=`<button class="back" data-open="edges">← 전체 Edge 목록</button>`+head(s.id,'선택한 Edge의 상태와 개별 화면')+`<section class="panel"><div class="summary"><div class="stat"><span class="muted">서버 응답</span><strong class="${s.cls}">${s.status}</strong><span class="muted">마지막 응답 ${s.signal}</span></div><div class="stat"><span class="muted">Viewers</span><strong>${s.viewers}</strong></div><div class="stat"><span class="muted">방송</span><strong>${s.room}</strong></div><div class="stat"><span class="muted">송신</span><strong>${s.rate}</strong></div></div></section><section class="panel"><h2>Edge 메뉴</h2><p class="placeholder">Overview · Workers · Broadcasts · Pipe 수신 · Viewers · Alerts</p><p class="muted">실제 구현 시 기존 Edge 화면이 선택한 서버의 데이터를 표시합니다.</p></section>`}}document.addEventListener('click',e=>{const nav=e.target.closest('[data-view],[data-open]');if(nav)render(nav.dataset.view||nav.dataset.open);const t=e.target.closest('[data-theme-choice]');if(t){document.documentElement.dataset.theme=t.dataset.themeChoice;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b===t))}});render('all');
</script></body></html>
